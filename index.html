<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뽀모도로 타이머</title>
<meta name="description" content="분과 초를 고르면 남은 시간이 원판으로 줄어드는 ADHD 친화 뽀모도로 타이머">
<meta name="theme-color" content="#e7e3f7">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
<script src="memo.js" defer></script>
</head>
<body>
<div class="page">
<div class="win">
<header class="tb">
  <span class="tb-title">뽀모도로 타이머</span>
  <span class="ptag">FOCUS_TIMER</span>
  <span class="sp"></span>
  <button type="button" class="gchip" id="soundBtn" aria-pressed="true">
    <svg class="ic ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
    <svg class="ic ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/><path d="M4 4l16 16"/></svg>
    알림음
  </button>
  <button type="button" class="gchip fs-chip" id="fsBtn" aria-pressed="false">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    전체 화면
  </button>
  <div class="wbtns" aria-hidden="true"><span>_</span><span>□</span><span class="x">X</span></div>
</header>

<main class="wbody" id="main">
  <p class="sr-only" role="status" id="announce"></p>

  <!-- 첫 화면: 시계 바늘 또는 드롭다운으로 시간 고르기 -->
  <section class="screen setup" id="scrSetup" aria-labelledby="setupH">
    <h1 class="h1" id="setupH">몇 분 동안 집중할까요?</h1>
    <div class="setup-cols">
      <div class="dialbox">
        <div class="dials">
          <svg class="dial" id="minDial" viewBox="0 0 340 340" role="group" aria-label="분 맞추는 시계">
            <defs>
              <linearGradient id="kF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="st-focus-1"/><stop offset="1" class="st-focus-2"/></linearGradient>
              <radialGradient id="kGl" cx="0.5" cy="0.2" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
            </defs>
            <circle class="shd" cx="172" cy="172" r="138"/>
            <circle class="face" cx="166" cy="166" r="136"/>
            <path class="wedge" id="kWedge" fill="url(#kF)" d=""/>
            <circle cx="166" cy="166" r="124" fill="url(#kGl)" pointer-events="none"/>
            <g class="tk tk-major">
              <line x1="166" y1="42" x2="166" y2="32"/><line x1="273.4" y1="104" x2="282" y2="99"/><line x1="273.4" y1="228" x2="282" y2="233"/>
              <line x1="166" y1="290" x2="166" y2="300"/><line x1="58.6" y1="228" x2="50" y2="233"/><line x1="58.6" y1="104" x2="50" y2="99"/>
            </g>
            <g class="tk tk-minor">
              <line x1="230" y1="55.2" x2="233" y2="50"/><line x1="294" y1="166" x2="300" y2="166"/><line x1="230" y1="276.8" x2="233" y2="282"/>
              <line x1="102" y1="276.8" x2="99" y2="282"/><line x1="38" y1="166" x2="32" y2="166"/><line x1="102" y1="55.2" x2="99" y2="50"/>
            </g>
            <g class="lbl" aria-hidden="true">
              <text x="166" y="14">0</text><text x="297.6" y="90">10</text><text x="297.6" y="242">20</text>
              <text x="166" y="318">30</text><text x="34.4" y="242">40</text><text x="34.4" y="90">50</text>
            </g>
            <line class="hand" id="kHand" x1="166" y1="166" x2="166" y2="54"/>
            <g class="knob" id="kKnob" tabindex="0" role="slider" aria-label="분 바늘" aria-valuemin="0" aria-valuemax="60" aria-valuenow="25" aria-valuetext="25분" transform="translate(166 54)">
              <circle class="ring" r="29"/><circle class="hit" r="22"/><path class="tip" d="M0 -15 L9 2 L-9 2 Z"/>
            </g>
            <circle class="pin" cx="166" cy="166" r="12"/><circle class="pin-dot" cx="166" cy="166" r="4"/>
          </svg>
          <div class="secbox">
            <svg class="sdial" id="secDial" viewBox="0 0 220 232" role="group" aria-label="초 맞추는 시계">
              <circle class="shd" cx="115" cy="121" r="78"/>
              <circle class="face face-s" cx="110" cy="116" r="78"/>
              <path class="wedge" id="sWedge" fill="url(#kF)" d=""/>
              <g class="tk tk-s"><line x1="110" y1="50" x2="110" y2="40"/><line x1="110" y1="182" x2="110" y2="192"/></g>
              <g class="lbl lbl-s" aria-hidden="true"><text x="110" y="20">0초</text><text x="110" y="214">30초</text></g>
              <line class="hand hand-s" id="sHand" x1="110" y1="116" x2="110" y2="64"/>
              <g class="knob" id="sKnob" tabindex="0" role="slider" aria-label="초 바늘" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" aria-valuetext="0초" transform="translate(110 64)">
                <circle class="ring" r="25"/><circle class="hit" r="19"/><path class="tip" d="M0 -13 L8 2 L-8 2 Z"/>
              </g>
              <circle class="pin" cx="110" cy="116" r="9"/>
            </svg>
            <p class="dcap">초 · 30초씩</p>
          </div>
        </div>
        <p class="readout" id="readout" aria-hidden="true">25분</p>
        <p class="dcap">큰 시계 바늘 끝을 끌면 분이 5분씩 바뀌어요</p>
      </div>

      <section class="card setup-card" aria-labelledby="setupH">
        <div class="card-hd"><span>SET_TIMER</span></div>
        <form class="card-bd" id="setupForm" novalidate>
          <div class="time-grp">
            <div class="time-row" role="group" aria-labelledby="setupH">
              <span class="selw"><select class="sel" id="minSel"></select><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
              <label class="unit" for="minSel">분</label>
              <span class="selw"><select class="sel" id="secSel"></select><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
              <label class="unit" for="secSel">초</label>
            </div>
            <p class="endline" id="endLine"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span id="endText">지금 시작하면 곧 끝나요</span></p>
            <p class="warn" id="timeErr" hidden>시간을 1초 이상 골라 주세요.</p>
          </div>
          <div class="field">
            <label class="flabel" for="taskInp">지금 할 일<small>(안 적어도 돼요)</small></label>
            <input class="inp" id="taskInp" type="text" maxlength="40" autocomplete="off" placeholder="예: 영어 단어 20개 외우기">
          </div>
          <div class="start-row">
            <button type="submit" class="gp gp-big" id="startBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M8 5.5v13l10.5-6.5z"/></svg>시작하기</button>
          </div>
          <p class="note">끝나면 알림음이 울려요. 쉬는 시간은 그때 고를 수 있어요.</p>
        </form>
      </section>
    </div>
  </section>

  <!-- 타이머 화면: 숫자 + 줄어드는 원판 -->
  <section class="screen run" id="scrRun" aria-labelledby="runH" hidden>
    <h1 class="sr-only" id="runH">타이머</h1>
    <div class="cluster">
      <span class="task"><span class="tk-k">NOW</span><span class="tk-t" id="runTask">집중 시간</span></span>
    </div>
    <div class="dg" id="digits" role="timer" aria-label="남은 시간">
      <span class="n">2</span><span class="n">5</span><span class="c">:</span><span class="n">0</span><span class="n">0</span>
    </div>
    <div class="disc">
      <svg id="runDisc" viewBox="0 0 340 340" role="img" aria-label="남은 시간 원판">
        <defs>
          <linearGradient id="gFocus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="st-focus-1"/><stop offset="1" class="st-focus-2"/></linearGradient>
          <linearGradient id="gRest" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="st-rest-1"/><stop offset="1" class="st-rest-2"/></linearGradient>
          <linearGradient id="gSoon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="st-soon-1"/><stop offset="1" class="st-soon-2"/></linearGradient>
          <radialGradient id="gGl" cx="0.5" cy="0.2" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
        </defs>
        <circle class="shd" cx="172" cy="172" r="156"/>
        <circle class="face" cx="166" cy="166" r="156"/>
        <path class="wedge" id="runWedge" fill="url(#gFocus)" d=""/>
        <circle cx="166" cy="166" r="132" fill="url(#gGl)" pointer-events="none"/>
        <g class="tk tk-major">
          <line x1="166" y1="30" x2="166" y2="14"/><line x1="302" y1="166" x2="318" y2="166"/><line x1="166" y1="302" x2="166" y2="318"/><line x1="30" y1="166" x2="14" y2="166"/>
        </g>
        <g class="tk tk-minor">
          <line x1="236.5" y1="43.89" x2="242" y2="34.37"/><line x1="288.11" y1="95.5" x2="297.63" y2="90"/><line x1="288.11" y1="236.5" x2="297.63" y2="242"/><line x1="236.5" y1="288.11" x2="242" y2="297.63"/>
          <line x1="95.5" y1="288.11" x2="90" y2="297.63"/><line x1="43.89" y1="236.5" x2="34.37" y2="242"/><line x1="43.89" y1="95.5" x2="34.37" y2="90"/><line x1="95.5" y1="43.89" x2="90" y2="34.37"/>
        </g>
        <line class="hand" id="runHand" x1="166" y1="166" x2="166" y2="42"/>
        <circle class="pin" cx="166" cy="166" r="18"/><circle class="pin-dot" cx="166" cy="166" r="6"/>
        <g id="pauseBadge" class="pause-badge">
          <circle cx="166" cy="166" r="36"/>
          <rect x="151" y="149" width="10" height="34" rx="3"/><rect x="171" y="149" width="10" height="34" rx="3"/>
        </g>
      </svg>
    </div>
    <div class="ctl" id="runCtl">
      <button type="button" class="gp gp-big" id="pauseBtn">
        <svg class="ic ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
        <svg class="ic ic-play" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M8 5.5v13l10.5-6.5z"/></svg>
        <span id="pauseLabel">멈추기</span>
      </button>
      <button type="button" class="gp gp-paper" id="stopBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>그만하기</button>
    </div>
    <div class="confirm" id="confirmRow" role="group" aria-labelledby="confirmQ" hidden>
      <p class="confirm-q"><b id="confirmQ">집중을 그만할까요?</b><span>그만하면 처음 화면으로 돌아가요.</span></p>
      <button type="button" class="gp gp-big" id="keepBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M8 5.5v13l10.5-6.5z"/></svg>계속하기</button>
      <button type="button" class="gp gp-no" id="quitBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>그만하기</button>
    </div>
  </section>

  <!-- 끝난 화면: 카드 -->
  <section class="screen done" id="scrDone" aria-labelledby="doneH" hidden>
    <section class="dcard">
      <div class="dc-tb" id="doneHead"><span class="ptag" id="doneTag">TIME_UP</span></div>
      <div class="dc-bd">
        <div class="dc-ic" aria-hidden="true">
          <svg viewBox="0 0 440 340">
            <defs>
              <linearGradient id="dF" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="st-focus-1"/><stop offset="1" class="st-focus-2"/></linearGradient>
              <linearGradient id="dR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="st-rest-1"/><stop offset="1" class="st-rest-2"/></linearGradient>
              <radialGradient id="dGl" cx="0.5" cy="0.2" r="0.6"><stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
            </defs>
            <path class="spark sp-butter" d="M52 44 Q52 70 78 70 Q52 70 52 96 Q52 70 26 70 Q52 70 52 44 Z"/>
            <path class="spark sp-pink" d="M392 34 Q392 54 412 54 Q392 54 392 74 Q392 54 372 54 Q392 54 392 34 Z"/>
            <path class="spark sp-lav" d="M398 236 Q398 262 424 262 Q398 262 398 288 Q398 262 372 262 Q398 262 398 236 Z"/>
            <path class="spark sp-mint" d="M44 238 Q44 254 60 254 Q44 254 44 270 Q44 254 28 254 Q44 254 44 238 Z"/>
            <circle class="shd" cx="226" cy="172" r="146"/>
            <circle class="face" cx="220" cy="166" r="146"/>
            <circle class="wedge" id="doneInner" cx="220" cy="166" r="104" fill="url(#dF)"/>
            <circle cx="220" cy="166" r="104" fill="url(#dGl)"/>
            <path class="check" d="M172 170 L208 206 L272 136"/>
          </svg>
        </div>
        <div class="dc-txt">
          <h1 class="done-h" id="doneH" tabindex="-1">시간 다 됐어요!</h1>
          <p class="done-sub" id="doneSub"></p>
          <span class="streak" id="streak"><span class="tk-k">TODAY</span><span id="streakText">집중 1번 끝냈어요</span></span>
        </div>
      </div>
      <div class="rest-row" id="restRow">
        <label class="flabel" for="restSel">쉬는 시간</label>
        <span class="selw"><select class="sel sel-sm" id="restSel" aria-label="쉬는 시간 (분)"></select><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
        <span class="unit" aria-hidden="true">분</span>
        <button type="button" class="gp gp-big gp-mint" id="restBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.5h11v4.5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 3.5c-.7 1 .7 1.8 0 3M12.5 3.5c-.7 1 .7 1.8 0 3"/></svg><span id="restLabel">5분 쉬기</span></button>
      </div>
      <div class="dc-ft">
        <button type="button" class="gp" id="againBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg><span id="againLabel">다시 집중하기 (25분)</span></button>
        <button type="button" class="gp gp-paper" id="homeBtn"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/></svg>처음으로</button>
      </div>
    </section>
    <button type="button" class="gchip" id="muteBtn" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>알림음 끄기</button>
  </section>
</main>
</div>
</div>
<noscript><p class="noscript">이 타이머는 자바스크립트가 켜져 있어야 움직여요.</p></noscript>
</body>
</html>
